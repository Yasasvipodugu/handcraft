<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KalaConnect AI — Smart Cataloging & Market Linkage for Artisans</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Rozha+One&family=Yatra+One&display=swap" rel="stylesheet">
    <script>
      // When hosted on GitHub Pages with default root folder, seamlessly redirect to /docs/
      (function() {
        var host = window.location.hostname;
        if (host !== 'localhost' && host !== '127.0.0.1') {
          var path = window.location.pathname;
          if (!path.includes('/docs')) {
            var target = path.endsWith('/') ? path + 'docs/' : path + '/docs/';
            window.location.replace(target + window.location.search + window.location.hash);
          }
        }
      })();
    </script>
  </head>
  <body class="bg-amber-50/30 text-stone-900 min-h-screen antialiased selection:bg-amber-700 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
